# SwiftSSH website, plain HTTP. Used until a certificate exists (and for Let's Encrypt checks).
# Installed by deploy/void/install.sh as /etc/nginx/conf.d/swiftssh-site.conf.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    root /var/www/swiftssh;
    index index.html;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Installers and executables: always a file download. ^~ so the asset rule below doesn't apply.
    location ^~ /downloads/ {
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
        add_header Cache-Control "public, max-age=3600";
        location = /downloads/latest.json {
            default_type application/json;
            add_header Cache-Control "no-cache";
        }
    }

    location ~* \.(css|js|svg|png|ico|woff2)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}

# Tests on every push to main and every pull request: the protocol tests, first-time setup over SSH
# against an in-process SSH server, and the npm package installed the way users get it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [18, 20, 24]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:package

  app:
    name: Desktop app build and app tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: node --check app/main.js
      - name: Build the installer (unsigned, not published)
        run: npm run release
      - name: App tests (the real app against throwaway servers)
        run: npm run test:app
      - name: Screenshots from the app tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-screenshots
          path: .test-home/app/*/shots/
          if-no-files-found: ignore

  package:
    name: Desktop app packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - name: Build the app and command line for this system (not published)
        shell: bash
        run: |
          set -o pipefail
          if ! npm run release 2>&1 | tee build.log; then
            # As an annotation too: readable without signing in.
            echo "::error title=Package build failed on $RUNNER_OS::$(grep -v '^ *at ' build.log | tail -30 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - run: ls -la site/downloads

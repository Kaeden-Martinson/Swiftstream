# Release: push a tag like v0.1.2 (matching package.json) and this builds, tests and publishes everything.
#   - Windows, macOS and Linux builds of the desktop app and the standalone command line
#   - one GitHub Release with every download, SHA256SUMS.txt, latest.json (the website's download list)
#     and the desktop app's update feeds (latest*.yml and friends)
#   - the npm package, published with provenance through npm trusted publishing (no token needed)
# See docs/RELEASING.md for the one-time setup.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    name: Check version and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Tag matches package.json and app/package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cli=$(node -p "require('./package.json').version")
          app=$(node -p "require('./app/package.json').version")
          if [ "$tag" != "$cli" ] || [ "$tag" != "$app" ]; then
            echo "::error::Tag v$tag doesn't match package.json ($cli) and app/package.json ($app)"
            exit 1
          fi
      - run: npm ci
      - run: npm test

  build:
    name: Build (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - name: Build the downloads
        run: npm run release
      - name: Collect the update feed
        shell: bash
        run: |
          mkdir -p feed
          v="${GITHUB_REF_NAME#v}"
          for f in app/release/latest*.yml app/release/*-"$v"*.blockmap app/release/Swiftstream-"$v"-mac.zip; do
            [ -f "$f" ] && cp "$f" feed/
          done
          ls site/downloads feed
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: |
            site/downloads/*
            !site/downloads/latest.json
            !site/downloads/SHA256SUMS.txt
            feed/*

  release:
    name: Create the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Put every platform's downloads together
        run: |
          mkdir -p site/downloads feed
          find artifacts -path '*/site/downloads/*' -type f -exec cp {} site/downloads/ \;
          find artifacts -path '*/feed/*' -type f -exec cp {} feed/ \;
          node scripts/release.mjs --manifest-only
          ls -la site/downloads feed
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; if (index($0, "[" v "]") || index($0, " " v)) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "See the commits for this version." > notes.md; fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" site/downloads/* feed/* --title "Swiftstream ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  npm:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm 11.5+ (trusted publishing)
        run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish --access public --provenance
